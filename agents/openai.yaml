interface:
  display_name: "Watchletic"
  short_description: "Analyze and manage your Watchletic training data"
  default_prompt: "Use $watchletic to analyze my recent training and draft next week’s structured workouts."

policy:
  allow_implicit_invocation: true

dependencies:
  tools:
    - type: mcp
      value: watchletic
      description: "Secure access to the user's Watchletic training data and actions"
      transport: streamable_http
      url: "https://api.watchletic.com/mcp"
